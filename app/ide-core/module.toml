version = 2

[module]
type = "java-lib"
name = "ide-core"
languageLevel = "JAVA_17"
output = "build/codestudio/classes"

[sourceSets.main]
scope = "IMPLEMENTATION"
java = ["src/main/kotlin"]
resources = ["src/main/resources"]

[sourceSets.test]
scope = "TEST_IMPLEMENTATION"
java = ["src/test/kotlin"]

[dependencies]
testImplementation = [{ platform = "org.junit:junit-bom:5.11.4" }, "org.jetbrains.kotlin:kotlin-test:2.4.0", { module = "test-support" }, "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0", { module = "store-impl" }, { module = "bench-support" }, "org.bouncycastle:bcpkix-jdk18on:1.78.1"]
